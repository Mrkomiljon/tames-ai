<title>TAMES AI Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: reading-room console. Header (language, outline mode) · case rail | result card, numbered step rail, one step at a time (picture | explanation). */
  :root {
    color-scheme: dark;
    --bg: #0b0e11; --panel: #12171c; --panel-2: #182027; --panel-3: #1e2730; --line: #242e38; --line-2: #33404c;
    --ink: #e8ecef; --ink-2: #c6ced5; --muted: #93a0ac; --faint: #5f6c78;
    --accent: #56b4e9; --accent-ink: #06121b;
    --benign: #3cc29a; --malig: #f07b3f; --amber: #e6b84f;
    --l-dl: #56b4e9; --l-rf: #cc79a7; --l-xgb: #e6a23c; --l-fsvm: #8fd3c0;
    --font-body: "Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace;
    --r: 10px;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; padding-inline: 20px; padding-block: 22px 44px; }
  .wrap { max-width: 1320px; margin: 0 auto; display: grid; gap: 18px; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .label { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.11em; text-transform: uppercase; color: var(--muted); }
  header { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px 28px; align-items: end; border-bottom: 1px solid var(--line); padding-bottom: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand b { font-family: var(--font-mono); font-weight: 500; font-size: 0.95rem; letter-spacing: 0.08em; color: var(--accent); }
  .brand span { color: var(--muted); font-size: 0.82rem; }
  header h1 { margin: 6px 0 6px; font-size: clamp(1.4rem, 2.5vw, 2rem); line-height: 1.15; text-wrap: balance; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); max-width: 70ch; }
  .switches { display: grid; gap: 8px; justify-items: end; }
  .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 999px; padding: 3px; background: var(--panel); }
  .seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 0.86rem; padding: 6px 14px; border-radius: 999px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .seg button:disabled { opacity: 0.4; cursor: not-allowed; }
  .seg.lang button { font-family: var(--font-mono); font-size: 0.78rem; padding: 5px 12px; }
  button:focus-visible, .case:focus-visible, .stage-btn:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .layout { display: grid; grid-template-columns: 264px minmax(0, 1fr); gap: 20px; align-items: start; }
  .layout > * { min-width: 0; }
  aside { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); overflow-y: auto; overscroll-behavior: contain; padding-right: 2px; }
  aside > * { min-width: 0; }
  .rail-title { display: flex; justify-content: space-between; align-items: baseline; }
  .cases { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .case { display: grid; grid-template-columns: 60px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); color: inherit; text-align: left; font: inherit; cursor: pointer; transition: border-color .15s, background .15s; }
  .case:hover { border-color: var(--line-2); }
  .case[aria-current="true"] { border-color: var(--accent); background: var(--panel-2); }
  .case img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; background: #000; }
  .case > span { min-width: 0; }
  .case .id { font-family: var(--font-mono); font-size: 0.82rem; display: block; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .chip { font-family: var(--font-mono); font-size: 0.66rem; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--muted); white-space: nowrap; }
  .chip.benign { color: var(--benign); border-color: color-mix(in srgb, var(--benign) 50%, transparent); }
  .chip.malignant { color: var(--malig); border-color: color-mix(in srgb, var(--malig) 50%, transparent); }
  .chip.ok { color: var(--ink); }
  .chip.miss { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 55%, transparent); }
  .upload { border: 1px dashed var(--line-2); border-radius: var(--r); padding: 12px; background: var(--panel); display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; font-size: 0.85rem; overflow: hidden; }
  .upload label { display: grid; gap: 4px; color: var(--muted); min-width: 0; }
  .upload input[type=file] { font: inherit; font-size: 0.76rem; color: var(--muted); width: 100%; min-width: 0; }
  .upload input[type=file]::file-selector-button { font: inherit; font-size: 0.76rem; color: var(--ink); background: var(--panel-3); border: 1px solid var(--line-2); border-radius: 6px; padding: 5px 10px; margin-right: 8px; cursor: pointer; }
  .btn { border: 1px solid var(--line-2); background: var(--panel-2); color: var(--ink); font: inherit; font-size: 0.86rem; padding: 7px 13px; border-radius: 8px; cursor: pointer; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .btn:disabled { opacity: 0.5; cursor: progress; }
  .note { color: var(--faint); font-size: 0.8rem; margin: 0; }
  main { display: grid; gap: 14px; min-width: 0; }
  /* result card */
  .summary { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px 24px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
  .summary .head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; margin-bottom: 8px; }
  .summary h2 { margin: 0; font-family: var(--font-mono); font-weight: 500; font-size: 1.05rem; }
  .vrow { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 10px; }
  .pill { font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 6px 14px; border-radius: 999px; font-size: 0.88rem; }
  .pill.benign { background: color-mix(in srgb, var(--benign) 18%, transparent); color: var(--benign); border: 1px solid var(--benign); }
  .pill.malignant { background: color-mix(in srgb, var(--malig) 18%, transparent); color: var(--malig); border: 1px solid var(--malig); }
  .pval { font-family: var(--font-mono); font-size: 1.5rem; line-height: 1; }
  .pval small { font-size: 0.75rem; color: var(--muted); margin-left: 6px; }
  .gtrack { position: relative; border-radius: 7px; overflow: hidden; background: var(--panel-2); border: 1px solid var(--line); }
  .gtrack.sm { height: 22px; } .gtrack.lg { height: 46px; }
  .zone { position: absolute; top: 0; bottom: 0; }
  .zone.b { left: 0; background: color-mix(in srgb, var(--benign) 24%, transparent); }
  .zone.m { right: 0; background: color-mix(in srgb, var(--malig) 20%, transparent); }
  .tline { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #fff; }
  .needle { position: absolute; top: 3px; bottom: 3px; width: 4px; margin-left: -2px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 10px var(--accent); transition: left 1200ms cubic-bezier(.2,.8,.2,1); }
  .stick { position: absolute; bottom: 4px; width: 2px; height: 12px; margin-left: -1px; background: var(--accent); opacity: 0.85; transition: left 900ms; }
  .gscale { position: relative; height: 1.2em; font-family: var(--font-mono); font-size: 0.7rem; color: var(--faint); margin-top: 4px; }
  .gscale span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .gscale span:first-child { transform: none; } .gscale span:last-child { transform: translateX(-100%); }
  .gscale .t { color: var(--ink-2); }
  .ref { display: grid; gap: 6px; align-content: start; border-left: 1px solid var(--line); padding-left: 20px; }
  .ref .dx { font-size: 1.1rem; font-weight: 700; }
  .ref .dx.benign { color: var(--benign); } .ref .dx.malignant { color: var(--malig); }
  .outcome { font-size: 0.9rem; padding: 8px 10px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line); }
  .outcome.ok::before { content: "✓ "; color: var(--benign); font-weight: 700; }
  .outcome.miss::before { content: "! "; color: var(--amber); font-weight: 700; }
  /* steps */
  .stages { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
  .stage-btn { border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 8px; padding: 7px 8px 8px; text-align: left; font: inherit; cursor: pointer; min-width: 0; position: relative; overflow: hidden; }
  .stage-btn .n { font-family: var(--font-mono); font-size: 0.68rem; color: var(--faint); display: block; }
  .stage-btn .t { font-size: 0.8rem; display: block; line-height: 1.25; min-height: 2.5em; overflow-wrap: anywhere; }
  .stage-btn.done { color: var(--ink-2); }
  .stage-btn.done .n { color: var(--muted); }
  .stage-btn[aria-current="step"] { border-color: var(--accent); color: var(--ink); background: var(--panel-2); }
  .stage-btn[aria-current="step"] .n { color: var(--accent); }
  .stage-btn .bar { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: var(--accent); }
  .stage-btn[aria-current="step"].playing .bar { animation: fill var(--dwell) linear forwards; }
  @keyframes fill { to { width: 100%; } }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .controls .spacer { flex: 1; }
  .rec { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--panel); padding: 2px 2px 2px 8px; }
  .rec select { font: inherit; font-size: 0.8rem; color: var(--ink-2); background: transparent; border: 0; padding: 4px 2px; }
  .rec select option { background: var(--panel); }
  .btn.rec-btn { border-color: transparent; background: var(--panel-2); }
  .btn.rec-btn::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #e5484d; margin-right: 7px; vertical-align: 0; }
  .recording .btn.rec-btn { background: #e5484d; color: #fff; }
  .recording .btn.rec-btn::before { background: #fff; border-radius: 2px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }
  .stage { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; min-height: 440px; }
  .visual { display: grid; gap: 10px; align-content: start; min-width: 0; }
  .reading { display: grid; gap: 12px; align-content: start; min-width: 0; }
  .stepno { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .stepno .eq { font-family: var(--font-mono); font-size: 0.72rem; color: var(--accent); }
  .reading h3 { margin: 0; font-size: 1.28rem; line-height: 1.25; text-wrap: balance; }
  .block h4 { margin: 0 0 3px; font-family: var(--font-mono); font-weight: 500; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .block p { margin: 0; color: var(--ink-2); max-width: 62ch; }
  .kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 16px; font-size: 0.88rem; margin: 0; padding: 10px 12px; background: var(--panel-2); border-radius: 8px; border: 1px solid var(--line); }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--font-mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .callout { font-size: 0.86rem; color: var(--ink-2); border-left: 2px solid var(--amber); padding: 2px 0 2px 10px; margin: 0; }
  details { border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); }
  details summary { cursor: pointer; padding: 8px 12px; font-size: 0.84rem; color: var(--muted); list-style: none; }
  details summary::before { content: "+ "; font-family: var(--font-mono); color: var(--accent); }
  details[open] summary::before { content: "− "; }
  details p { margin: 0; padding: 0 12px 10px; font-size: 0.84rem; color: var(--ink-2); }
  .tiles { display: grid; gap: 10px; }
  .tiles.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  figure.tile { margin: 0; display: grid; gap: 6px; min-width: 0; }
  figure.tile figcaption { font-size: 0.78rem; color: var(--muted); }
  .sweep { position: relative; border-radius: 8px; overflow: hidden; background: #000; border: 1px solid var(--line); }
  .sweep img { display: block; width: 100%; height: auto; max-width: 100%; }
  .sweep.square img { aspect-ratio: 1 / 1; object-fit: cover; }
  .sweep.anim img { animation: reveal 1100ms cubic-bezier(.3,.7,.2,1) both; }
  .sweep.anim::after { content: ""; position: absolute; left: 0; right: 0; height: 2px; top: 0; background: linear-gradient(90deg, transparent, var(--accent), transparent); box-shadow: 0 0 12px var(--accent); animation: scan 1100ms cubic-bezier(.3,.7,.2,1) both; }
  @keyframes reveal { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes scan { from { top: 0; opacity: 1; } 92% { opacity: 1; } to { top: 100%; opacity: 0; } }
  .desc { display: grid; gap: 7px; }
  .drow { display: grid; grid-template-columns: 10.5em minmax(0, 1fr) 4.2em; gap: 10px; align-items: center; font-size: 0.82rem; }
  .drow .name { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .drow .val { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
  .track { position: relative; height: 22px; border-radius: 4px; background: var(--panel-2); }
  .band { position: absolute; height: 6px; border-radius: 3px; opacity: 0.8; }
  .band.b { top: 3px; background: var(--benign); } .band.m { bottom: 3px; background: var(--malig); }
  .med { position: absolute; width: 2px; height: 10px; margin-left: -1px; background: #fff; opacity: 0.5; }
  .med.b { top: 1px; } .med.m { bottom: 1px; }
  .dot { position: absolute; top: 50%; width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; border-radius: 50%; background: #fff; border: 2px solid var(--bg); box-shadow: 0 0 0 1px #fff; transition: left 900ms cubic-bezier(.3,.7,.2,1); }
  .dot.out::after { content: attr(data-dir); position: absolute; top: -18px; left: -2px; color: var(--amber); font-size: 0.75rem; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.78rem; color: var(--muted); }
  .sw { display: inline-block; width: 18px; height: 6px; border-radius: 3px; vertical-align: middle; margin-right: 6px; }
  .emb { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 2px; }
  .emb span { aspect-ratio: 1; border-radius: 2px; background: var(--panel-2); transition: background 600ms; }
  .tablewrap { overflow-x: auto; }
  table.learn { width: 100%; min-width: 460px; border-collapse: separate; border-spacing: 0 9px; font-size: 0.82rem; }
  table.learn th { text-align: left; font-weight: 400; color: var(--muted); font-size: 0.74rem; padding: 0 6px; vertical-align: bottom; }
  table.learn td { padding: 0 6px; vertical-align: middle; }
  table.learn td.set { font-family: var(--font-mono); color: var(--muted); white-space: nowrap; }
  .mini { position: relative; height: 18px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }
  .mini .f { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 4px; transition: width 900ms cubic-bezier(.3,.7,.2,1); }
  .mini .tk { position: absolute; top: 0; bottom: 0; width: 1px; background: #fff; opacity: 0.7; }
  .mini .lbl { position: absolute; right: 5px; top: 0; font-family: var(--font-mono); font-size: 0.72rem; line-height: 18px; color: var(--ink); text-shadow: 0 0 3px #000; }
  .w { font-family: var(--font-mono); font-size: 0.66rem; color: var(--faint); }
  .status { font-size: 0.82rem; color: var(--muted); min-height: 1.2em; }
  .status.err { color: var(--amber); }
  footer { color: var(--faint); font-size: 0.8rem; border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; }
  footer a { color: var(--muted); }
  @media (max-width: 1040px) {
    .layout { grid-template-columns: minmax(0, 1fr); } aside { position: static; }
    .cases { grid-auto-flow: column; grid-auto-columns: minmax(214px, 1fr); overflow-x: auto; padding-bottom: 4px; }
    .stage { grid-template-columns: minmax(0, 1fr); } .stages { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    header { grid-template-columns: minmax(0, 1fr); } .switches { justify-items: start; }
    aside { max-height: none; overflow: visible; }
    .cases { grid-template-columns: none; }
  }
  @media (max-width: 640px) { .summary { grid-template-columns: minmax(0, 1fr); } .brand { flex-wrap: wrap; } .ref { border-left: 0; border-top: 1px solid var(--line); padding: 12px 0 0; } .drow { grid-template-columns: 7.8em minmax(0, 1fr) 3.8em; } }
  @media (prefers-reduced-motion: reduce) {
    .sweep.anim img, .sweep.anim::after, .stage-btn .bar { animation: none !important; }
    .dot, .mini .f, .needle, .stick, .emb span { transition: none !important; }
  }
</style>

<div class="wrap">
  <header>
    <div>
      <div class="brand"><b>TAMES AI</b><span id="t-sub"></span></div>
      <h1 id="t-h1"></h1>
      <p id="t-lead"></p>
    </div>
    <div class="switches">
      <div class="seg lang" role="group" aria-label="Language / Til">
        <button id="l-en" type="button" aria-pressed="true">EN</button>
        <button id="l-uz" type="button" aria-pressed="false">UZ</button>
      </div>
      <div class="seg" role="group" id="mode-group">
        <button id="m-expert" type="button" aria-pressed="true"></button>
        <button id="m-auto" type="button" aria-pressed="false"></button>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside>
      <div class="rail-title"><span class="label" id="t-cases"></span><span class="mono label" id="count"></span></div>
      <div class="cases" id="cases"></div>
      <div class="upload" id="upload" hidden>
        <strong id="t-up"></strong>
        <label for="up-img"><span id="t-up-img"></span><input id="up-img" type="file" accept="image/*"></label>
        <label for="up-mask"><span id="t-up-mask"></span><input id="up-mask" type="file" accept="image/*"></label>
        <button class="btn primary" id="up-run" type="button"></button>
        <div class="status" id="up-status" role="status"></div>
      </div>
      <p class="note" id="offline-note"></p>
    </aside>

    <main>
      <section class="summary" id="summary" aria-live="polite"></section>
      <nav class="stages" id="stages" aria-label="Pipeline"></nav>
      <div class="controls">
        <button class="btn" id="prev" type="button"></button>
        <button class="btn primary" id="play" type="button"></button>
        <button class="btn" id="next" type="button"></button>
        <span class="spacer"></span>
        <span class="rec" id="rec" hidden><select id="rec-scope" aria-label="Recording scope"><option value="one"></option><option value="all"></option></select><button class="btn rec-btn" id="rec-btn" type="button"></button></span>
        <span class="note" id="hint"></span>
        <span class="status" id="rec-status" role="status"></span>
      </div>
      <section class="stage" id="stage"></section>
    </main>
  </div>

  <footer><span id="t-foot"></span><a href="https://github.com/Mrkomiljon/tames-ai" target="_blank" rel="noopener">github.com/Mrkomiljon/tames-ai</a></footer>
</div>

<script id="tames-data" type="application/json">__TAMES_DATA__</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById("tames-data").textContent);
  const f3 = (v) => v.toFixed(3), f2 = (v) => v.toFixed(2);
  const fmt = (v) => (Math.abs(v) >= 100 ? v.toFixed(0) : v.toFixed(3));

  /* ---------- text, English and Uzbek ---------- */
  const T = {
    en: {
      sub: "Thyroid nodule ultrasound · TN3K test set · research prototype",
      h1: "How TAMES AI reaches a decision",
      lead: "Pick a test image and follow it through eight steps, from the raw ultrasound frame to the benign or malignant call. Every picture and number is produced by the trained models.",
      modeGroup: "Nodule outline", expert: "Expert outline", automatic: "Automatic outline",
      cases: "Test images", benign: "benign", malignant: "malignant", uploaded: "uploaded",
      oc: { TP: "true positive", TN: "true negative", FP: "false positive", FN: "false negative" },
      ocLine: { TP: "Correct: malignant nodule detected.", TN: "Correct: benign nodule cleared.", FP: "False positive: benign nodule flagged for review.", FN: "False negative: malignant nodule missed." },
      noRef: "No reference diagnosis for an uploaded image.",
      pred: "Model prediction", prob: "probability", thr: "threshold", ref: "Reference diagnosis", setting: "outline",
      prev: "◀ Previous", next: "Next ▶", play: "Play", pause: "Pause",
      hint: "Click a step to jump · ← → keys · space to pause",
      rec: "Record demo", recStop: "Stop", recOne: "This image", recAll: "All images", recAsk: "In the dialog, choose this tab and press Share.",
      recSaved: (f) => `Saved ${f} to your Downloads folder.`, recNo: "Screen recording is not available in this browser; use Chrome or Edge.", recCancel: "Recording cancelled.",
      step: (i, n) => `Step ${i} of ${n}`,

    $("l-en").setAttribute("aria-pressed", lang === "en"); $("l-uz").setAttribute("aria-pressed", lang === "uz");
    $("rec-scope").options[0].textContent = t.recOne; $("rec-scope").options[1].textContent = t.recAll;
    $("rec-btn").textContent = REC.mr ? `${t.recStop} · ${clock()}` : t.rec;
  }
  function renderCases() {
    const t = L();
    $("count").textContent = DATA.cases.length;
    $("cases").innerHTML = DATA.cases.map((c, i) => {
      const r = c.modes[mode] || c.modes[Object.keys(c.modes)[0]], o = outcome(c, mode);
      return `<button class="case" type="button" data-i="${i}" aria-current="${i === ci}">
        <img src="${r.images.thumb}" alt="">
        <span><span class="id">${esc(c.id)}</span><span class="chips">
          ${c.truth ? `<span class="chip ${c.truth}">${label(c.truth)}</span>` : `<span class="chip">${t.uploaded}</span>`}
          ${o ? `<span class="chip ${o === "TP" || o === "TN" ? "ok" : "miss"}" title="${t.oc[o]}">${o}</span>` : ""}
          <span class="chip mono">p ${f2(r.p_final)}</span></span></span></button>`;
    }).join("");
    $("cases").querySelectorAll(".case").forEach((b) => b.addEventListener("click", () => { ci = +b.dataset.i; si = 0; render(); restart(); }));
  }
  const scale = (r) => `<div class="gscale"><span>0</span><span class="t" style="left:${r.t_star * 100}%">t* ${f3(r.t_star)}</span><span style="left:50%">0.5</span><span style="left:100%">1</span></div>`;
  function renderSummary() {
    const t = L(), c = cur(), r = run(), o = outcome(c, mode);
    $("summary").innerHTML = `<div>
        <div class="head"><h2>${esc(c.id)}</h2><span class="label">${t.pred} · ${t[r.mode]}</span></div>
        <div class="vrow"><span class="pill ${r.label}">${label(r.label)}</span><span class="pval">${f3(r.p_final)}<small>${t.prob}</small></span><span class="label">${t.thr} t* = ${f3(r.t_star)}</span></div>
        <div class="gtrack sm"><span class="zone b" style="width:${r.t_star * 100}%"></span><span class="zone m" style="left:${r.t_star * 100}%"></span><span class="tline" style="left:${r.t_star * 100}%"></span><span class="needle" data-left="${r.p_final * 100}" style="left:${reduced ? r.p_final * 100 : 0}%"></span></div>
        ${scale(r)}</div>
      <div class="ref"><span class="label">${t.ref}</span>
        ${c.truth ? `<span class="dx ${c.truth}">${label(c.truth)}</span><div class="outcome ${o === "TP" || o === "TN" ? "ok" : "miss"}">${t.ocLine[o]}</div>` : `<div class="outcome">${t.noRef}</div>`}</div>`;
  }
  function renderStages() {
    const t = L();
    $("stages").innerHTML = t.stages.map((s, i) => `<button class="stage-btn ${i < si ? "done" : ""} ${playing ? "playing" : ""}" type="button" data-i="${i}" ${i === si ? 'aria-current="step"' : ""} style="--dwell:${DWELL}ms"><span class="n">${String(i + 1).padStart(2, "0")}</span><span class="t">${s}</span><span class="bar"></span></button>`).join("");
    $("stages").querySelectorAll(".stage-btn").forEach((b) => b.addEventListener("click", () => { si = +b.dataset.i; render(); restart(); }));
  }
  const tile = (src, cap, cls = "square") => `<figure class="tile"><div class="sweep ${cls} ${reduced ? "" : "anim"}"><img src="${src}" alt="${esc(cap)}"></div><figcaption>${cap}</figcaption></figure>`;
  const mini = (p, col, thr) => `<div class="mini"><span class="f" data-w="${p * 100}" style="background:${col};width:${reduced ? p * 100 : 0}%"></span><span class="tk" style="left:${thr * 100}%"></span><span class="lbl">${f2(p)}</span></div>`;
  function visual(r, c) {
    const t = L(), lang_uz = lang === "uz";
    switch (si) {
      case 0: return tile(r.images.raw, `${c.id} · ${r.size[0]} × ${r.size[1]} px`, "");
      case 1: return `<div class="tiles two">${tile(r.images.crop, lang_uz ? "normallangan tasvir x̃" : "normalized image x̃")}${tile(r.images.mu, lang_uz ? "a’zolik μ" : "membership μ")}</div>`;
      case 2: return `<div class="tiles two">${tile(r.images.F, lang_uz ? "fuzzy xarita F" : "fuzzy map F")}${tile(r.images.otsu, lang_uz ? "Otsu(F) (ko‘k), kontur (oq)" : "Otsu(F) (blue), outline (white)")}</div>`;
      case 3: return `<div class="tiles two">${tile(r.images.annotated, r.mode === "expert" ? (lang_uz ? "radiolog konturi (to‘q sariq), kesma qutisi" : "expert outline (orange), crop box") : (lang_uz ? "avtomatik kontur (ko‘k), kesma qutisi" : "automatic outline (blue), crop box"), "")}<div class="tiles">${tile(r.images.crop, lang_uz ? "1-kanal: x̃" : "channel 1: x̃")}${tile(r.images.F, lang_uz ? "2-kanal: F" : "channel 2: F")}</div></div>`;
      case 4: return `<div class="desc">${r.descriptors.map((d) => {
          const [lo, hi] = d.axis, span = hi - lo || 1, pos = (v) => Math.max(0, Math.min(100, ((v - lo) / span) * 100));
          const out = d.value < lo ? "◂" : d.value > hi ? "▸" : "", nm = t.desc[d.key] || [d.label, d.help];
          return `<div class="drow" title="${esc(nm[1])}"><span class="name">${esc(nm[0])}</span><span class="track">
            <span class="band b" style="left:${pos(d.benign[0])}%;width:${Math.max(1, pos(d.benign[2]) - pos(d.benign[0]))}%"></span>
            <span class="band m" style="left:${pos(d.malignant[0])}%;width:${Math.max(1, pos(d.malignant[2]) - pos(d.malignant[0]))}%"></span>
            <span class="med b" style="left:${pos(d.benign[1])}%"></span><span class="med m" style="left:${pos(d.malignant[1])}%"></span>
            <span class="dot ${out ? "out" : ""}" data-dir="${out}" data-left="${pos(d.value)}" style="left:${reduced ? pos(d.value) : 50}%"></span></span>
            <span class="val">${fmt(d.value)}</span></div>`; }).join("")}</div>
          <div class="legend"><span><span class="sw" style="background:var(--benign)"></span>${t.bandsB}</span><span><span class="sw" style="background:var(--malig)"></span>${t.bandsM}</span><span>${t.thisOne}</span></div>`;
      case 5: return `<div class="tiles two">${r.images.cam ? tile(r.images.cam, "Grad-CAM") : ""}<figure class="tile"><div class="emb" id="emb">${r.embedding.map(() => "<span></span>").join("")}</div><figcaption>${lang_uz ? "tasvir embeddingi h_img: 128 son" : "image embedding h_img: 128 numbers"}</figcaption></figure></div>`;
      case 6: {
        const avg = (k) => r.per_seed.reduce((a, s) => a + s.weights[k], 0) / r.per_seed.length;
        const ks = ["dl", "rf", "xgb", "fsvm"];
        return `<div class="tablewrap"><table class="learn"><thead><tr><th>${t.set}</th>${ks.map((k) => `<th>${t.learn[k]}<br><span class="w">${t.meanW} ${f2(avg(k))}</span></th>`).join("")}<th>${t.ens}</th></tr></thead><tbody>
          ${r.per_seed.map((s, j) => `<tr><td class="set">${j + 1}</td>${ks.map((k) => `<td title="ω ${f2(s.weights[k])}">${mini(s[k], `var(--l-${k})`, r.t_star)}</td>`).join("")}<td>${mini(s.ensemble, "var(--accent)", r.t_star)}</td></tr>`).join("")}</tbody></table></div>`;
      }
      default: return `<div class="vrow"><span class="pval" style="font-size:2.3rem">${f3(r.p_final)}</span><span class="pill ${r.label}">${label(r.label)}</span></div>
        <div class="gtrack lg"><span class="zone b" style="width:${r.t_star * 100}%"></span><span class="zone m" style="left:${r.t_star * 100}%"></span><span class="tline" style="left:${r.t_star * 100}%"></span>
          ${r.per_seed.map((s) => `<span class="stick" data-left="${s.ensemble * 100}" style="left:${reduced ? s.ensemble * 100 : 0}%"></span>`).join("")}<span class="needle" data-left="${r.p_final * 100}" style="left:${reduced ? r.p_final * 100 : 0}%"></span></div>
        ${scale(r)}
        <div class="legend"><span><span class="sw" style="background:color-mix(in srgb,var(--benign) 55%,transparent)"></span>${t.zoneB}</span><span><span class="sw" style="background:color-mix(in srgb,var(--malig) 55%,transparent)"></span>${t.zoneM}</span><span>${t.seeds}</span></div>`;
    }
  }
  function reading(r, c) {
    const t = L(), s = t.S(r, c)[si];
    return `<div class="stepno"><span class="label">${t.step(si + 1, 8)}</span><span class="eq">${s.eq}</span></div>
      <h3>${s.title}</h3>
      <div class="block"><h4>${t.what}</h4><p>${s.what}</p></div>
      <div class="block"><h4>${t.see}</h4><p>${s.see}</p></div>
      ${s.kv.length ? `<dl class="kv">${s.kv.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>` : ""}
      ${s.callout ? `<p class="callout">${s.callout}</p>` : ""}
      <details><summary>${t.tech}</summary><p>${s.tech}</p></details>`;
  }
  function animateIn(r) {
    requestAnimationFrame(() => requestAnimationFrame(() => {
      document.querySelectorAll("[data-left]").forEach((e) => (e.style.left = e.dataset.left + "%"));
      document.querySelectorAll(".mini .f").forEach((e) => (e.style.width = e.dataset.w + "%"));
      const emb = document.getElementById("emb");
      if (emb) { const v = r.embedding, mx = Math.max(...v.map(Math.abs)) || 1;
        emb.querySelectorAll("span").forEach((s, i) => { const a = Math.abs(v[i]) / mx; setTimeout(() => (s.style.background = `rgba(86,180,233,${0.08 + 0.92 * a})`), reduced ? 0 : i * 6); }); }
    }));
  }
  function render() {
    const c = cur(), r = run();
    staticText();
    $("m-expert").setAttribute("aria-pressed", mode === "expert"); $("m-auto").setAttribute("aria-pressed", mode === "automatic");
    $("m-expert").disabled = !c.modes.expert; $("m-auto").disabled = !c.modes.automatic;
    if (!c.modes[mode]) mode = Object.keys(c.modes)[0];
    renderCases(); renderSummary(); renderStages();
    $("stage").innerHTML = `<div class="visual">${visual(r, c)}</div><div class="reading">${reading(r, c)}</div>`;
    animateIn(r);
    $("play").textContent = playing ? L().pause : L().play;
  }
  function restart() {
    clearTimeout(timer); if (!playing) return;
    timer = setTimeout(() => {
      if (si < 7) si++;
      else {
        if (REC.mr && (REC.scope === "one" || ci === REC.lastCase)) { stopRec(); return; }
        si = 0; ci = (ci + 1) % DATA.cases.length;
      }
      render(); restart();
    }, DWELL);
  }
  const REC = { mr: null, chunks: [], t0: 0, tick: null, scope: "one", lastCase: 0, mime: "" };
  const clock = () => { const s = Math.floor((Date.now() - REC.t0) / 1000); return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };
  const recMsg = (m, err) => { $("rec-status").textContent = m || ""; $("rec-status").className = "status" + (err ? " err" : ""); $("hint").hidden = !!m; };
  async function startRec() {
    const t = L();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia || !window.MediaRecorder) { recMsg(t.recNo, true); return; }
    recMsg(t.recAsk);
    let stream;
    try {
      stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30, displaySurface: "browser" }, audio: false, preferCurrentTab: true, selfBrowserSurface: "include", surfaceSwitching: "exclude" });
    } catch (e) { recMsg(t.recCancel); return; }
    const types = ["video/mp4;codecs=avc1.640028", "video/mp4", "video/webm;codecs=vp9", "video/webm"];
    REC.mime = types.find((m) => MediaRecorder.isTypeSupported(m)) || "";
    REC.mr = new MediaRecorder(stream, REC.mime ? { mimeType: REC.mime, videoBitsPerSecond: 8000000 } : undefined);
    REC.chunks = [];
    REC.mr.ondataavailable = (e) => { if (e.data && e.data.size) REC.chunks.push(e.data); };
    REC.mr.onstop = () => {
      stream.getTracks().forEach((tr) => tr.stop());
      const type = REC.mr.mimeType || REC.mime || "video/webm", ext = type.includes("mp4") ? "mp4" : "webm";
      const d = new Date(), pad = (n) => String(n).padStart(2, "0");
      const name = `tames-ai-demo-${lang}-${REC.scope === "all" ? "all" : cur().id}-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.${ext}`;
      const url = URL.createObjectURL(new Blob(REC.chunks, { type }));
      const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      REC.mr = null; clearInterval(REC.tick); document.body.classList.remove("recording"); recMsg(L().recSaved(name)); staticText();
    };
    stream.getVideoTracks()[0].addEventListener("ended", () => stopRec());
    REC.scope = $("rec-scope").value;
    if (REC.scope === "all") { ci = 0; REC.lastCase = DATA.cases.length - 1; } else { REC.lastCase = ci; }
    si = 0; playing = true; recMsg("");
    document.body.classList.add("recording");
    await new Promise((ok) => setTimeout(ok, 400));   // let the share bar settle before the first frame
    REC.mr.start(1000); REC.t0 = Date.now();
    REC.tick = setInterval(() => ($("rec-btn").textContent = `${L().recStop} · ${clock()}`), 500);
    render(); restart();
  }
  function stopRec() { if (REC.mr && REC.mr.state !== "inactive") { playing = false; clearTimeout(timer); REC.mr.stop(); render(); } }
  $("rec-btn").onclick = () => (REC.mr ? stopRec() : startRec());
  $("prev").onclick = () => { si = Math.max(0, si - 1); render(); restart(); };
  $("next").onclick = () => { si = Math.min(7, si + 1); render(); restart(); };
  $("play").onclick = () => { playing = !playing; render(); restart(); };
  $("m-expert").onclick = () => { mode = "expert"; render(); restart(); };
  $("m-auto").onclick = () => { mode = "automatic"; render(); restart(); };
  const setLang = (l) => { lang = l; store.set("tames-lang", l); render(); };
  $("l-en").onclick = () => setLang("en"); $("l-uz").onclick = () => setLang("uz");
  document.addEventListener("keydown", (e) => { if (["INPUT", "SUMMARY"].includes(e.target.tagName)) return; if (e.key === "ArrowRight") $("next").click(); if (e.key === "ArrowLeft") $("prev").click(); if (e.key === " " && e.target.tagName !== "BUTTON") { e.preventDefault(); $("play").click(); } });
  // pause autoplay while the reader opens technical detail
  document.addEventListener("toggle", (e) => { if (e.target.tagName === "DETAILS" && e.target.open && playing) { playing = false; clearTimeout(timer); $("play").textContent = L().play; document.querySelectorAll(".stage-btn").forEach((b) => b.classList.remove("playing")); } }, true);

  // live mode: only when served by scripts/13_demo_server.py
  const readB64 = (f) => new Promise((ok, bad) => { const rd = new FileReader(); rd.onload = () => ok(String(rd.result).split(",")[1]); rd.onerror = bad; rd.readAsDataURL(f); });
  fetch("api/health").then((r) => (r.ok ? r.json() : Promise.reject())).then((h) => {
    if (!h || !h.ok) return;
    $("upload").hidden = false; $("offline-note").hidden = true;
    if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia && window.MediaRecorder) $("rec").hidden = false;
    $("up-run").onclick = async () => {
      const f = $("up-img").files[0], m = $("up-mask").files[0], st = $("up-status");
      if (!f) { st.textContent = L().upNeed; st.className = "status err"; return; }
      $("up-run").disabled = true; st.className = "status"; st.textContent = L().upBusy(h.models || 20);
      try {
        const body = { name: f.name, image: await readB64(f), mask: m ? await readB64(m) : null };
        const res = await fetch("api/predict", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        const js = await res.json(); if (!res.ok) throw new Error(js.error || res.statusText);
        DATA.cases.unshift(js); ci = 0; si = 0; mode = js.modes.expert ? "expert" : "automatic"; playing = !reduced;
        const rr = js.modes[mode]; st.textContent = L().upDone(f3(rr.p_final), label(rr.label)); render(); restart();
      } catch (e) { st.className = "status err"; st.textContent = L().upErr + e.message; }
      finally { $("up-run").disabled = false; }
    };
  }).catch(() => {});

  render(); restart();
})();
</script>
